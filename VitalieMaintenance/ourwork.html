<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vital Maintenance – Our Work</title>
  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <a class="brand" href="index.html">
      <img src="images/logo.png" alt="Vital Maintenance" />
    </a>

    <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav>
      <ul class="nav-links" id="nav">
        <li><a href="index.html">Home</a></li>
        <li><a class="active" href="ourwork.html">Our Work</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero small -->
  <section class="hero hero-sm">
    <img class="hero-bg" src="images/pic5.png" alt="Renovation banner">
    <div class="hero-overlay"></div>
    <div class="hero-content container reveal">
      <h1>Our Work</h1>
      <p>Click a category to browse the gallery.</p>
    </div>
  </section>

  <!-- Gallery -->
  <section class="section container">
    <div class="gallery-grid">
      <button class="gallery-card reveal" data-gallery="kitchen">
        <img loading="lazy" src="images/Kitchen/IMG_2281.png" alt="Kitchen" />
        <span>Kitchen</span>
      </button>

      <button class="gallery-card reveal" data-gallery="bathroom">
        <img loading="lazy" src="images/Bathroom/Bathroom.png" alt="Bathroom" />
        <span>Bathroom</span>
      </button>

      <button class="gallery-card reveal" data-gallery="painting">
        <img loading="lazy" src="images/Painting/Painting.png" alt="Painting" />
        <span>Painting</span>
      </button>

      <button class="gallery-card reveal" data-gallery="tiling">
        <img loading="lazy" src="images/tiling/Tiling.png" alt="Tiling" />
        <span>Tiling</span>
      </button>

      <button class="gallery-card reveal" data-gallery="flooring">
        <img loading="lazy" src="images/Flooring/Flooring.png" alt="Flooring" />
        <span>Flooring</span>
      </button>

      <button class="gallery-card reveal" data-gallery="extensions">
        <img loading="lazy" src="images/Conversions & Extensions/Conversion.png" alt="Extensions" />
        <span>Extensions</span>
      </button>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lb-close" aria-label="Close">×</button>
    <img class="lightbox-img" id="lightbox-img" alt="">
    <div class="lightbox-cap" id="lightbox-cap"></div>
    <button class="lightbox-arrow left" id="lb-prev" aria-label="Previous">‹</button>
    <button class="lightbox-arrow right" id="lb-next" aria-label="Next">›</button>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>© <span id="year"></span> Vital Maintenance. All rights reserved.</p>
  </footer>

  <script src="js/script.js" defer></script>
</body>
</html>
